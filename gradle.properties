org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# One module only: parallel execution buys nothing and costs memory.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
# Run kotlinc inside the Gradle process. The separate Kotlin daemon is a known
# source of silent stalls on CI runners, which is exactly what we hit.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
